# Kiểm tra giấy phép/lỗ hổng phụ thuộc (thiết kế §12.1, ADR-0010).
# Danh sách giấy phép cho phép là KHỞI ĐIỂM; rà lại khi chốt giấy phép của Lexora.
[advisories]
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
