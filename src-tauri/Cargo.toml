[package]
name = "lexora"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Lexora desktop shell (Tauri 2): cửa sổ, IPC, platform adapters, kho khóa."

[lib]
# Không đặt tên `windows`/`linux` cho module nội bộ để tránh trùng tên crate `windows` ở M1.
name = "lexora_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lexora-core = { path = "../crates/core" }
lexora-providers = { path = "../crates/providers" }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

# ---- Phụ thuộc theo nền tảng: CỐ Ý CHƯA KHAI BÁO. Chọn + pin sau PoC (thiết kế §8.2) ----
# POC-H (Linux): ashpd (GlobalShortcuts portal)
# POC-S (Windows): crate `windows` (UI Automation, Win32 clipboard/focus)
# POC-S (Linux): binding AT-SPI hoặc zbus
# POC-K: credential store backend (xem docs/adr/0008 và thiết kế §9.2 về `keyring`/`keyring-core`)
